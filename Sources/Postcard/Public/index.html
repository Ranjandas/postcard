<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postcard</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <div class="header-inner">
    <div class="app-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="3"></rect>
        <circle cx="8.5" cy="10.5" r="1.5"></circle>
        <path d="M21 15.5l-5-4.5-4.5 4-2.5-2-6 5.5"></path>
      </svg>
    </div>
    <div class="header-text">
      <h1>Postcard</h1>
      <p class="subtitle">Drop short clips below to frame them as postcards.</p>
    </div>
  </div>
</header>

<main>

<section id="drop-zone" tabindex="0">
  <div class="drop-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 16V4"></path>
      <path d="M7 9l5-5 5 5"></path>
      <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path>
    </svg>
  </div>
  <p class="drop-title">Drag &amp; drop video clips or photos here</p>
  <p class="drop-hint">or click to choose files</p>
  <input type="file" id="file-input" accept="video/*,image/*" multiple hidden>
</section>

<section id="global-controls" hidden>
  <div class="control-group">
    <span class="control-label">Aspect ratio</span>
    <div id="aspect-ratio-buttons" class="segmented">
      <div class="segmented-indicator"></div>
      <button type="button" class="ratio-btn" data-w="9" data-h="16">9:16<small>Story/Reel</small></button>
      <button type="button" class="ratio-btn active" data-w="4" data-h="5">4:5<small>Portrait</small></button>
      <button type="button" class="ratio-btn" data-w="1" data-h="1">1:1<small>Square</small></button>
      <button type="button" class="ratio-btn" data-w="3" data-h="4">3:4<small>Tall</small></button>
      <button type="button" class="ratio-btn" data-w="1.91" data-h="1">1.91:1<small>Landscape</small></button>
    </div>
  </div>
  <div class="control-group sliders-row">
    <label class="radius-control">
      Corner roundedness
      <input type="range" class="slider" id="radius-slider" min="0" max="100" value="30">
      <span id="radius-value">30%</span>
    </label>
    <label class="radius-control">
      Side padding
      <input type="range" class="slider" id="padding-slider" min="0" max="40" value="0">
      <span id="padding-value">0%</span>
    </label>
  </div>
  <div class="actions">
    <button id="export-all-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L4 14h6l-1 7 9-11h-6l1-7z"></path></svg>
      <span>Export All</span>
    </button>
    <button id="reveal-btn" class="secondary">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"></path></svg>
      <span>Reveal Output Folder</span>
    </button>
  </div>
</section>

<section id="clips"></section>

</main>

<template id="clip-card-template">
  <article class="clip-card">
    <div class="canvas-preview">
      <video class="bg-blur-video" muted playsinline preload="metadata"></video>
      <img class="bg-blur-img" alt="">
      <video class="main-video" playsinline preload="metadata"></video>
      <img class="main-img" alt="">
      <button type="button" class="play-overlay" aria-label="Play">
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"></path></svg>
      </button>
      <button type="button" class="edit-overlay" aria-label="Edit photo">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
        </svg>
      </button>
    </div>
    <div class="clip-info">
      <div class="clip-info-text">
        <div class="clip-name"></div>
        <div class="clip-meta"></div>
      </div>
      <button type="button" class="delete-btn" aria-label="Remove clip" title="Remove clip">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16"></path>
          <path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"></path>
          <path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
        </svg>
      </button>
    </div>
    <div class="background-control">
      <span class="control-label-sm">Background</span>
      <div class="bg-swatches"></div>
      <label class="bg-custom-swatch" title="Custom color">
        <input type="color" class="bg-color-input" value="#ffffff">
      </label>
      <button type="button" class="bg-blur-btn" title="Fill the background with a blurred copy of the video">Blur</button>
    </div>
    <div class="trim-control">
      <div class="trim-track">
        <div class="trim-range"></div>
        <div class="trim-playhead"></div>
      </div>
      <input type="range" class="trim-start" min="0" max="1" step="0.01" value="0">
      <input type="range" class="trim-end" min="0" max="1" step="0.01" value="1">
      <div class="trim-labels">
        <span class="trim-start-label">0:00.0</span>
        <span class="trim-duration-label"></span>
        <span class="trim-end-label">0:00.0</span>
      </div>
    </div>
    <div class="clip-status">
      <span class="status-text">Ready</span>
      <button class="export-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M7.5 11L12 15.5 16.5 11"></path><path d="M4 18h16"></path></svg>
        <span>Export</span>
      </button>
    </div>
  </article>
</template>

<div id="photo-editor" class="photo-editor" hidden>
  <div class="editor-backdrop"></div>
  <div class="editor-panel">
    <div class="editor-preview-area">
      <button type="button" class="editor-close-btn" aria-label="Close editor">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"></path>
          <path d="M6 6l12 12"></path>
        </svg>
      </button>

      <div class="editor-canvas-preview canvas-preview">
        <img class="editor-bg-blur-img bg-blur-img" alt="">
        <div class="editor-crop-wrapper">
          <img class="editor-main-img" alt="">
        </div>
      </div>

      <div class="crop-stage" hidden>
        <img class="crop-stage-img" alt="">
        <div class="crop-rect">
          <div class="crop-handle" data-edge="nw"></div>
          <div class="crop-handle" data-edge="n"></div>
          <div class="crop-handle" data-edge="ne"></div>
          <div class="crop-handle" data-edge="e"></div>
          <div class="crop-handle" data-edge="se"></div>
          <div class="crop-handle" data-edge="s"></div>
          <div class="crop-handle" data-edge="sw"></div>
          <div class="crop-handle" data-edge="w"></div>
        </div>
      </div>

      <svg class="tone-curve-defs" width="0" height="0" aria-hidden="true">
        <filter id="editor-tone-curve" color-interpolation-filters="sRGB">
          <feComponentTransfer>
            <feFuncR type="table" tableValues="0 1"></feFuncR>
            <feFuncG type="table" tableValues="0 1"></feFuncG>
            <feFuncB type="table" tableValues="0 1"></feFuncB>
          </feComponentTransfer>
        </filter>
      </svg>
    </div>

    <div class="editor-sidebar">
      <div class="editor-clip-name"></div>

      <div class="control-group">
        <button type="button" class="crop-tool-btn secondary">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"></path><path d="M18 22V8a2 2 0 0 0-2-2H2"></path></svg>
          <span>Crop</span>
        </button>
        <button type="button" class="crop-reset-btn secondary" hidden>Reset</button>
        <button type="button" class="crop-done-btn" hidden>Done</button>
      </div>

      <div class="background-control editor-background-control">
        <span class="control-label-sm">Background</span>
        <div class="bg-swatches"></div>
        <label class="bg-custom-swatch" title="Custom color">
          <input type="color" class="bg-color-input" value="#ffffff">
        </label>
        <button type="button" class="bg-blur-btn" title="Fill the background with a blurred copy of the photo">Blur</button>
      </div>

      <div class="adjustments-control editor-adjustments-control">
        <label class="adjust-row">
          <span class="adjust-label">Exposure</span>
          <input type="range" class="slider adjust-exposure" min="-100" max="100" value="0">
          <span class="adjust-value exposure-value">0</span>
        </label>
        <label class="adjust-row">
          <span class="adjust-label">Highlights</span>
          <input type="range" class="slider adjust-highlights" min="-100" max="100" value="0">
          <span class="adjust-value highlights-value">0</span>
        </label>
        <label class="adjust-row">
          <span class="adjust-label">Shadows</span>
          <input type="range" class="slider adjust-shadows" min="-100" max="100" value="0">
          <span class="adjust-value shadows-value">0</span>
        </label>
        <label class="adjust-row">
          <span class="adjust-label">Brightness</span>
          <input type="range" class="slider adjust-brightness" min="-100" max="100" value="0">
          <span class="adjust-value brightness-value">0</span>
        </label>
        <label class="adjust-row">
          <span class="adjust-label">Contrast</span>
          <input type="range" class="slider adjust-contrast" min="-100" max="100" value="0">
          <span class="adjust-value contrast-value">0</span>
        </label>
        <label class="adjust-row">
          <span class="adjust-label">Black Point</span>
          <input type="range" class="slider adjust-blackpoint" min="-100" max="100" value="0">
          <span class="adjust-value blackpoint-value">0</span>
        </label>
      </div>

      <div class="editor-actions">
        <button class="editor-export-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M7.5 11L12 15.5 16.5 11"></path><path d="M4 18h16"></path></svg>
          <span>Export</span>
        </button>
        <span class="editor-status-text status-text"></span>
      </div>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
